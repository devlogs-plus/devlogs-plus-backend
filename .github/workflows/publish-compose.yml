name: Publish production Compose

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish production Compose application
        env:
          POSTGRES_PASSWORD: compose-publish-placeholder
          DOMAIN: example.com
        run: |
          printf 'COMPOSE_PUBLISH_PLACEHOLDER=1\n' > backend.env
          docker compose -f docker-compose.prod.yaml publish \
            --app \
            --yes \
            "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
